<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><style>body{font-family:system-ui,sans-serif;background:#f7f8f1;color:#35402b;margin:0;padding:25px;line-height:1.6}h1{font-size:24px}button{padding:12px 18px;border:0;border-radius:7px;background:#5c7047;color:white;font:inherit;cursor:pointer}input{display:block;margin:20px 0;max-width:100%}progress{width:100%;height:24px}.note{color:#899477;font-size:12px}#status{white-space:pre-wrap}button:disabled{opacity:.5}</style><h1>사진 · 디자인 파일 올리기</h1><p>Google 로그인 없이 이 주문 항목에 첨부합니다.</p><p class="note">이미지 · PDF · AI · PSD/PSB · ZIP · SKP · GLB<br>파일당 최대 2GB · 연결이 끊기면 같은 파일을 골라 이어 올릴 수 있습니다.</p><input id="files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.pdf,.ai,.psd,.psb,.zip,.skp,.glb"><button id="start">파일 올리기 / 이어 올리기</button> <button id="stop" disabled>일시 중지</button><progress id="progress" value="0" max="100"></progress><p id="status" role="status">파일을 선택해 주세요.</p><p class="note">저장 위치: 다희 / 첨부<br>완료 후 주문판에 자동 첨부됩니다. 이 창을 닫기 전에 완료 메시지를 확인하세요.</p><script>
const boot=<?!= boot ?>,input=document.getElementById('files'),status=document.getElementById('status'),bar=document.getElementById('progress'),start=document.getElementById('start'),stop=document.getElementById('stop');let paused=false;function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));}function base64(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(blob);});}function inform(file){if(window.opener&&/^https:\/\/[A-Za-z0-9.-]+(?::\d+)?$/.test(boot.origin))window.opener.postMessage({type:'mumutori-upload',nonce:boot.nonce,target:boot.target,file:file},boot.origin);}
stop.onclick=()=>{paused=true;status.textContent='현재 조각 전송 후 중지합니다. 같은 파일을 선택하면 이어 올립니다.';};start.onclick=async()=>{if(!input.files.length)return;paused=false;start.disabled=true;stop.disabled=false;try{for(const f of input.files){if(paused)break;const fingerprint=boot.target+':'+f.name+':'+f.size+':'+f.lastModified,key='mumutori-upload:'+fingerprint;let id=localStorage.getItem(key),r;if(id){try{r=await call('offlineUploadStatus',boot.k,id);}catch(e){localStorage.removeItem(key);id=null;}}if(!id){r=await call('offlineStartUpload',boot.k,{name:f.name,size:f.size,target:boot.target,by:boot.by});id=r.id;localStorage.setItem(key,id);}let failures=0;while(!r.done&&!paused){status.textContent=f.name+' · '+Math.floor(r.offset/f.size*100)+'% 전송 중';const piece=await base64(f.slice(r.offset,Math.min(f.size,r.offset+2*1024*1024)));try{r=await call('offlineUploadChunk',boot.k,id,r.offset,piece);failures=0;}catch(e){status.textContent='연결을 확인하며 전송 위치를 조회합니다…';const fresh=await call('offlineUploadStatus',boot.k,id);if(fresh.offset===r.offset&&++failures>=3)throw e;r=fresh;}bar.value=r.offset/f.size*100;}if(r.done){inform(r.file);localStorage.removeItem(key);status.textContent=f.name+' · Drive 저장 완료, 주문판에 첨부 알림을 보냈습니다.';}}if(paused)status.textContent+='\n일시 중지됨. 같은 파일을 골라 이어 올릴 수 있습니다.';}catch(e){status.textContent=(e.message||String(e))+'\n같은 파일을 골라 이어 올리기를 눌러 주세요.';}finally{start.disabled=false;stop.disabled=true;}};
</script></html>
